[package]
name = "ue2emu"
description = "U64-II / C64 Ultimate firmware emulator (CLI + window)"
edition.workspace = true
version.workspace = true
license.workspace = true

[features]
default = ["trx64", "net"]
# TRX64 as the C64 behind the cart/DMA registers (docs/specs/S14-c64-trx64.md): needs the TRX64 checkout and a C++
# toolchain. Without it `--c64 none`, the T0 register stub, is the only choice.
trx64 = ["dep:c64-bridge", "dep:trx64-core", "dep:trx64-monitor"]
# `--net user` through libslirp (crates/ue2-net/build.rs links it). Without it `--net user` reports that it is missing;
# the other modes are unaffected (docs/specs/S22-windows.md).
net = ["ue2-net/slirp"]

[dependencies]
ue2-core = { path = "../ue2-core" }
ue2-net = { path = "../ue2-net", default-features = false }
ue2-vfat = { path = "../ue2-vfat" }
c64-bridge = { path = "../c64-bridge", optional = true }
# S23: the monitor's verbs as a library, and the machine they run against. Same pin as c64-bridge's trx64-core.
trx64-core = { git = "https://github.com/Jondalar/TRX64", tag = "v0.9.0", optional = true }
trx64-monitor = { git = "https://github.com/Jondalar/TRX64", tag = "v0.9.0", optional = true }
# --c64-roms writes into the flash disk's FAT volume (the version ue2-vfat uses).
fatfs = "0.3.6"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# run --config FILE.toml (config.rs).
toml = "1"
# Proven pairing from TRX64 trx64-cli (winit owns the main thread on macOS).
winit = "0.30"
softbuffer = "0.4"
png = "0.17"
gdbstub = "0.7"
gdbstub_arch = "0.3"
# SID audio out (--audio), the backend TRX64 trx64-cli uses (CoreAudio / ALSA / WASAPI).
cpal = "0.15"

[dev-dependencies]
rv32 = { path = "../rv32" }
tempfile = "3"
