[package]
name = "c64-bridge"
description = "TRX64 (trx64-core) as the C64 behind the U64-II cart/DMA registers"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ue2-core = { path = "../ue2-core" }
# TRX64 (GPL-3.0-or-later), pinned to main 69c9b30. The bridge drives its public internals (`VicII::tick`, the CIA
# clocks, `memconfig_table`/`pla_index`, the cartridge slot; docs/specs/S14-c64-trx64.md §4-§8), so an upstream
# refactor can break the build or change behaviour: re-run the tests and the C64 smokes (docs/status/c64.md) before
# moving `rev`. Verified against a448229589d36b0f4d9af1985108c19303c32973 (branch spec-843-inspect; its three commits
# on top of main touch only c64re_snapshot.rs, vic.rs and vic_inspect.rs, which the bridge does not call) and against
# this rev. trx64-core's build.rs compiles vendored reSID C++.
trx64-core = { git = "https://github.com/Jondalar/TRX64", rev = "69c9b30add4ea3ae7a46a53e81c56887585fe001" }
