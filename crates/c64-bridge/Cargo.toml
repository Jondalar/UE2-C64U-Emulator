[package]
name = "c64-bridge"
description = "TRX64 (trx64-core) as the C64 behind the U64-II cart/DMA registers"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
ue2-core = { path = "../ue2-core" }
# TRX64 (GPL-3.0-or-later), pinned to v0.7.3 (4ab20e5): the expansion port (Spec 850), the `u64` machine profile
# (851) and the UCI block (852) this bridge uses, plus the REU and its borrowed store (853, 854), several SIDs (855)
# the turbo fast path (856) and the CIA alarm check (857). It also drives
# TRX64's public internals
# (`memconfig_table`/`pla_index`, the cartridge slot; docs/specs/S14-c64-trx64.md §4-§8), so an upstream refactor can
# break the build or change behaviour: re-run the tests and the C64 smokes (docs/status/c64.md) before moving `rev`.
# trx64-core's build.rs compiles vendored reSID C++.
trx64-core = { git = "https://github.com/Jondalar/TRX64", tag = "v0.9.0" }
