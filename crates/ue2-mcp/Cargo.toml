[package]
name = "ue2-mcp"
description = "MCP server (stdio) that runs and drives ue2emu emulator instances for firmware testing"
edition.workspace = true
version.workspace = true
license.workspace = true

[[bin]]
name = "ue2-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
png = "0.17"
rmcp = { version = "3.3.0", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "time", "sync", "signal", "fs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Threading"] }
