# Build and test on every push to main and on pull requests.
#
# The runners have no firmware and no ROMs, so the tests that need them print "skipping" and pass. Everything else
# runs: CPU, devices, loader formats, FAT, USB directory sync, --config, MCP and the TRX64 bridge.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple silicon. libslirp from Homebrew lands in /opt/homebrew/lib, where crates/ue2-net/build.rs looks.
          - name: macos-arm64
            os: macos-latest
            container: ''
          # ue2-net uses the libslirp 4.7 API (crates/ue2-net/src/ffi.rs), which is what Ubuntu 24.04 ships.
          - name: linux-x86_64
            os: ubuntu-latest
            container: ''
          # MSVC; libslirp 4.9 and its glib from vcpkg (docs/specs/S22-windows.md §4-5).
          - name: windows-x86_64
            os: windows-latest
            container: ''
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install libslirp

      - name: System libraries (Linux)
        # ALSA is what cpal links against; pkg-config is how alsa-sys finds it.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libslirp-dev libasound2-dev pkg-config

      - name: vcpkg (Windows)
        id: vcpkg
        if: runner.os == 'Windows'
        run: |
          root=$(cygpath -u "$VCPKG_INSTALLATION_ROOT")
          echo "root=$root" >> "$GITHUB_OUTPUT"
          echo "installed=$VCPKG_INSTALLATION_ROOT\\installed" >> "$GITHUB_OUTPUT"
          echo "rev=$(git -C "$root" rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # A cold build of glib takes 20-30 minutes; the installed tree only changes with vcpkg itself.
      - name: libslirp cache (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ${{ steps.vcpkg.outputs.installed }}
          key: vcpkg-libslirp-x64-windows-${{ steps.vcpkg.outputs.rev }}

      - name: System libraries (Windows)
        # crates/ue2-net/build.rs links slirp from SLIRP_LIB_DIR and compiles its layout check against the header in
        # the include directory next to it; the DLLs must be on PATH for the tests.
        if: runner.os == 'Windows'
        run: |
          set -eu
          "${{ steps.vcpkg.outputs.root }}/vcpkg" install libslirp:x64-windows
          echo "SLIRP_LIB_DIR=$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\lib" >> "$GITHUB_ENV"
          echo "$VCPKG_INSTALLATION_ROOT\\installed\\x64-windows\\bin" >> "$GITHUB_PATH"

      - name: Toolchain
        run: |
          set -eu
          if ! command -v rustc >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
          cache-on-failure: true

      - name: Build
        run: cargo build --workspace --locked

      - name: Test
        run: cargo test --workspace --locked
