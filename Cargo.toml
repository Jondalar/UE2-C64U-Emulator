[workspace]
resolver = "2"
members = ["crates/rv32", "crates/ue2-core", "crates/ue2-net", "crates/ue2-vfat", "crates/ue2emu", "crates/ue2-mcp", "crates/c64-bridge"]

[workspace.package]
edition = "2021"
version = "0.4.0"
license = "GPL-3.0-or-later"

# The interpreter is unusably slow at opt-level 0; tests run the real firmware.
[profile.dev]
opt-level = 1

[profile.release]
debug = 1
lto = "thin"
codegen-units = 1
